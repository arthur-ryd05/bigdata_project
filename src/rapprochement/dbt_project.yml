name: rapprochement
version: "1.0.0"
profile: rapprochement

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: [target, dbt_packages]

vars:
  # Periode couverte par le releve brut (voir src/ingestion/extract_berka.py)
  period_start: "1998-07-01"
  period_end: "1998-12-31"

models:
  rapprochement:
    # Silver (puis gold) est ecrit en Parquet sur S3 (materialisation external de dbt-duckdb) :
    # chaque modele fixe son chemin avec la macro lake_path().
    silver:
      +materialized: external
